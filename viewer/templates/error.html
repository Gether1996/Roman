<!DOCTYPE html>
<html lang="sk">
<head>
    {% include '_standalone_head.html' %}
    <title>Chyba – Masáže Vlčince</title>
</head>
<body>
<main class="card">
    <div class="icon err"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h1>{{ message }}</h1>
    {% if detail %}<p>{{ detail }}</p>{% endif %}
    <div class="actions">
        <a class="btn btn-primary" href="/">Späť na úvodnú stránku</a>
        {% if show_admin_link %}<a class="btn btn-soft" href="/sprava/rezervacie">Administrácia</a>{% endif %}
    </div>
</main>
</body>
</html>
