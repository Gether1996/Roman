{% load static %}<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'fontawesome/css/all.css' %}">
    <style>
      :root{--bg:#f5f1ea;--text:#1e2c2f;--muted:#66757a;--brand:#0f7e7a;--line:rgba(30,44,47,.1);--danger:#b83b5e}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif}
      .card{width:min(560px,100%);background:#fffaf4;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(29,28,25,.12)}
      h1{font-size:1.6rem;margin:.2rem 0 1rem;line-height:1.25}.icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;margin-bottom:.5rem}
      .ok{background:rgba(15,126,122,.12);color:var(--brand)}.warn{background:rgba(217,119,6,.14);color:#b45309}.err{background:rgba(184,59,94,.12);color:var(--danger)}
      dl{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1rem;margin:1rem 0 1.5rem;font-size:.95rem}dt{color:var(--muted)}dd{margin:0;font-weight:600;word-break:break-word}
      .btn{display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:999px;padding:.8rem 1.4rem;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none}
      .btn-primary{background:var(--brand);color:#fff}.btn-soft{background:#fff;color:var(--text);border:1px solid var(--line)}.actions{display:flex;gap:.6rem;flex-wrap:wrap}
      p{color:var(--muted);line-height:1.6}
    </style>
