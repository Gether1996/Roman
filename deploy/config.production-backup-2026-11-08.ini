# Záloha nastavení maserov z produkčného servera – stav k 08. 11. 2026
# (prepísané zo screenshotu admin nastavení).
#
# Obnovenie do databázy (prepíše aktuálne nastavenia v DB):
#   docker compose exec web python manage.py import_config_ini --path deploy/config.production-backup-2026-11-08.ini --force
#
# Pozn.: reservations_per_page nebolo na screenshote, preto tu nie je – pri importe sa doplní predvolená hodnota (100).
# Dni, ktoré nie sú vo working_days, sú vypnuté; ich hodiny sú uložené len pre prípad opätovného zapnutia.

[settings-roman]
days_ahead = 30
working_days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday']
monday_starting_hour = 09:00
monday_ending_hour = 14:00
tuesday_starting_hour = 09:00
tuesday_ending_hour = 20:00
wednesday_starting_hour = 09:00
wednesday_ending_hour = 20:00
thursday_starting_hour = 09:00
thursday_ending_hour = 14:00
friday_starting_hour = 09:00
friday_ending_hour = 20:00
saturday_starting_hour = 08:30
saturday_ending_hour = 17:00
sunday_starting_hour = 10:00
sunday_ending_hour = 15:00

